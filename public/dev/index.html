<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05030d"><title>SHAN API Developer Platform V2</title>
<link rel="stylesheet" href="/dev/css/dev.css">
<link rel="stylesheet" href="/dev/css/dev-v2.css">
</head><body>
<div id="boot" class="loading" style="min-height:100vh"><span class="spin"></span>Loading…</div>
<div id="maintScreen" class="maint" hidden></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside>
  <div class="scrim" id="scrim"></div>
  <div class="main">
    <div id="annBar"></div>
    <header class="top">
      <button class="burger" id="burger" aria-label="Menu" type="button"></button>
      <div class="search"><span id="sIc"></span><input id="gsearch" placeholder="Search APIs, docs…" aria-label="Search APIs" autocomplete="off"></div>
      <span class="sp"></span>
      <button class="iconbtn" id="bell" aria-label="Notifications" type="button"></button>
      <div class="who" id="who" tabindex="0" role="button" aria-label="Account"></div>
    </header>
    <main id="view"></main>
    <div id="footer"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="/dev/js/app.js"></script>
</body></html>
