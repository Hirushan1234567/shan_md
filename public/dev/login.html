<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05030d"><title>Sign in — SHAN API Developer Platform V2</title>
<link rel="stylesheet" href="/dev/css/dev.css">
</head><body>
<div class="authwrap"><div class="authcard">
  <div class="brand"><span class="crown">👑</span><b>SHAN API</b><small>Developer Platform V2</small></div>
  <div id="maint" class="warnbox" hidden style="margin-bottom:12px"></div>
  <div class="tabs" id="tabs" style="justify-content:center"><button data-t="login" class="on">Sign in</button><button data-t="register">Create account</button></div>

  <form id="login" data-form="login" novalidate>
    <label class="field"><span>Username or email</span><input class="input" id="lUser" autocomplete="username" maxlength="120"></label>
    <label class="field"><span>Password</span><input class="input" id="lPass" type="password" autocomplete="current-password" maxlength="200"></label>
    <div id="lErr"></div>
    <button class="btn block" type="submit">Sign in</button>
    <p class="sm mt" style="text-align:center"><a href="#" id="toForgot">Forgot password?</a></p>
  </form>

  <form id="register" data-form="register" hidden novalidate>
    <label class="field"><span>Username</span><input class="input" id="rUser" autocomplete="username" maxlength="24" placeholder="3-24 letters, numbers, . _ -"></label>
    <label class="field"><span>Email</span><input class="input" id="rMail" type="email" autocomplete="email" maxlength="120"></label>
    <label class="field"><span>Password</span><input class="input" id="rPass" type="password" autocomplete="new-password" maxlength="64" placeholder="8+ characters, letters and numbers"></label>
    <div id="rErr"></div>
    <button class="btn block" type="submit">Create free account</button>
    <p class="sm muted mt" style="text-align:center">Free plan: 50 requests per API key, lifetime.</p>
  </form>

  <form id="forgot" data-form="forgot" hidden novalidate>
    <p class="muted sm" style="margin-bottom:10px">Enter your account email. If e-mail sending is configured you will get a reset link; otherwise ask an admin for one.</p>
    <label class="field"><span>Email</span><input class="input" id="fMail" type="email" autocomplete="email" maxlength="120"></label>
    <div id="fErr"></div>
    <button class="btn block" type="submit">Send reset link</button>
    <p class="sm mt" style="text-align:center"><a href="#" id="backLogin">Back to sign in</a></p>
  </form>

  <form id="reset" data-form="reset" hidden novalidate>
    <h2 style="font-size:17px;margin-bottom:10px">Choose a new password</h2>
    <label class="field"><span>New password</span><input class="input" id="nPass" type="password" autocomplete="new-password" maxlength="64"></label>
    <div id="nErr"></div>
    <button class="btn block" type="submit">Reset password</button>
  </form>

  <p class="sm dim mt" style="text-align:center">Platform admin? <a href="/dev/admin">Admin login</a> · <a href="/">SHAN MINI BOT</a></p>
</div></div>
<div id="toast" class="toast"></div>
<script type="module" src="/dev/js/login.js"></script>
</body></html>
