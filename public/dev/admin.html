<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#05030d"><meta name="robots" content="noindex"><title>Admin — SHAN API Developer Platform V2</title>
<link rel="stylesheet" href="/dev/css/dev.css">
</head><body>
<div id="gate" class="authwrap" hidden><div class="authcard">
  <div class="brand"><span class="crown">🛡</span><b>ADMIN</b><small>SHAN API Developer Platform V2</small></div>
  <form id="alogin" novalidate>
    <label class="field"><span>Admin username</span><input class="input" id="au" autocomplete="username" maxlength="40"></label>
    <label class="field"><span>Admin password</span><input class="input" id="ap" type="password" autocomplete="current-password" maxlength="200"></label>
    <div id="ae"></div><button class="btn block" type="submit">Sign in to admin panel</button>
  </form>
  <p class="sm dim mt" style="text-align:center"><a href="/dev/login">← Developer login</a></p>
</div></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side"></aside><div class="scrim" id="scrim"></div>
  <div class="main">
    <header class="top"><button class="burger" id="burger" type="button" aria-label="Menu"></button><b id="ptitle">Admin</b><span class="sp"></span><span class="pill" id="maintPill" hidden>maintenance ON</span><div class="who" id="who"></div></header>
    <main id="view"></main><div id="footer"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script type="module" src="/dev/js/admin.js"></script>
</body></html>
