<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHAN Developer Portal</title><style>body{margin:0;background:#090817;color:#eee;font:15px system-ui}main{max-width:950px;margin:35px auto;padding:20px}.card{background:#17142b;border:1px solid #39305e;border-radius:15px;padding:20px;margin:14px 0}h1{color:#b99cff}button{background:#8055ef;color:white;border:0;border-radius:8px;padding:11px 16px;margin:5px}input,textarea{background:#0c0a18;color:white;border:1px solid #514579;border-radius:8px;padding:12px;margin:5px;max-width:90%}pre{white-space:pre-wrap;overflow-wrap:anywhere;color:#b8f4d0}.muted{color:#aaa}</style><main><h1>SHAN API Developer Portal</h1><p class="muted">API keys · Usage · Documentation · Support</p><section class="card"><h2>Login</h2><p>Use your existing SHAN dashboard login session.</p><button onclick="load()">Load developer account</button><pre id="out">Not loaded</pre></section><section class="card"><h2>API Keys</h2><input id="label" placeholder="Key label"><button onclick="createKey()">Generate API key</button><div id="keys"></div></section><section class="card"><h2>API Catalog & Docs</h2><button onclick="catalog()">Load endpoints</button><button onclick="docs()">Read documentation</button><pre id="docs"></pre></section><section class="card"><h2>Support ticket</h2><input id="subject" placeholder="Subject"><br><textarea id="message" placeholder="Describe your issue"></textarea><br><button onclick="ticket()">Submit ticket</button></section><section class="card"><h2>API status</h2><button onclick="health()">Check status</button><pre id="health"></pre></section></main><script>const api=async(p,o={})=>{let r=await fetch('/api'+p,{...o,headers:{'Content-Type':'application/json',...(o.headers||{})}});let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j};async function load(){try{let x=await api('/developer/overview');out.textContent=JSON.stringify(x,null,2);keys.innerHTML=x.keys.map(k=>`<p>${k.label} · ${k.prefix} · ${k.active?'Active':'Revoked'} <button onclick="revoke('${k.id}')">Revoke</button></p>`).join('')}catch(e){out.textContent=e.message}}async function createKey(){try{let x=await api('/developer/keys',{method:'POST',body:JSON.stringify({label:label.value})});keys.innerHTML+=`<p>NEW KEY (copy now): <pre>${x.key}</pre></p>`;load()}catch(e){alert(e.message)}}async function revoke(id){try{await api('/developer/keys/revoke',{method:'POST',body:JSON.stringify({id})});load()}catch(e){alert(e.message)}}async function catalog(){docs.textContent=JSON.stringify(await api('/developer/catalog'),null,2)}async function docs(){docs.textContent=JSON.stringify(await api('/developer/docs'),null,2)}async function health(){health.textContent=JSON.stringify(await api('/developer/health'),null,2)}async function ticket(){try{let x=await api('/developer/tickets',{method:'POST',body:JSON.stringify({subject:subject.value,message:message.value})});alert('Ticket submitted: '+x.id)}catch(e){alert(e.message)}}</script></html>
